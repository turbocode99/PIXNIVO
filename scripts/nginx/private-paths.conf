# Repository files that are not part of the website.
# Installed as /etc/nginx/snippets/pixnivo-private-paths.conf and included in each
# server block that uses root /var/www/html, before any other regex location
# (the first matching regex wins, so this must precede the static-asset rule).
# Install or update it with scripts/install_nginx_private_paths.sh.
location ^~ /.git/         { return 404; }
location ^~ /backend/      { return 404; }
location ^~ /scripts/      { return 404; }
location ^~ /tests/        { return 404; }
location ^~ /node_modules/ { return 404; }
location ^~ /scratch_test/ { return 404; }
location ~ /\.(?!well-known/) { return 404; }
location ~* \.(sh|py|pyc|env|ini|log|bak|tmp|sql|toml|lock|jsx|md)$ { return 404; }
location ~* ^/(package(-lock)?\.json|_redirects)$ { return 404; }
