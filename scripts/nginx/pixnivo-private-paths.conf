# PIXNIVO: never serve repo internals from the web root.
#
# /var/www/html is a git checkout, so everything in the repo (including .git/)
# is reachable unless blocked here. Include this file in EVERY server { } block
# whose root is /var/www/html (pixnivo.app and admin.pixnivo.app), ABOVE the
# existing `location / { ... }` and any other regex locations:
#
#     include snippets/pixnivo-private-paths.conf;
#
# Install steps are in scripts/README.md.

# Git metadata: full source history, incl. deleted files.
location ^~ /.git/ { return 404; }

# Any other dotfile/dotdir (.gitignore, .netlify/, ...), but keep ACME challenges working.
location ~ /\.(?!well-known/) { return 404; }

# Operational scripts, dev tests, and backend source/data (served by the API, not as files).
location ^~ /scripts/ { return 404; }
location ^~ /tests/   { return 404; }
location ^~ /backend/ { return 404; }

# Tooling/config files at the repo root.
location ~ ^/(package(-lock)?\.json|netlify\.toml|_redirects)$ { return 404; }

# Script/source/leftover types the site never serves as static files.
location ~* \.(sh|py|pyc|jsx|md|log|bak|tmp)$ { return 404; }
